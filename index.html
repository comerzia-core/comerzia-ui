<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shop_trim.png" />
    <link rel="apple-touch-icon" href="/shop_trim.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comerzia ERP</title>
    <script>
      (function() {
        // 1. Intentamos leer el tema guardado
        const storedTheme = localStorage.getItem('theme');
        
        // 2. Si existe, lo usamos. Si no, forzamos 'light' por defecto.
        const themeToApply = storedTheme || 'light';
        
        // 3. Lo aplicamos INMEDIATAMENTE al HTML
        document.documentElement.setAttribute('data-theme', themeToApply);
      })();
    </script>
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
